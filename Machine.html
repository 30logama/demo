<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.x/dist/aframe-physics-system.min.js"></script>    
    </head>
    <body>
        <a-scene>
            
            <a-plane static-body color="lightblue" position="0 0 0" width="30" height="30" rotation="-90 0 0"
            ></a-plane>
            
            <a-sphere dynamic-body position="0 50 -8" color="green"
            ></a-sphere>
            
            <a-box static-body position="-3 2.8 -8" color="orange" width="1" depth="3" height="5"></a-box>

            <a-box static-body position="15 2.5 -6" color="orange" width="1" depth="5" height="5"></a-box>
            
            <a-box static-body rotation="0 55 0" position="12 2.5 -8" color="orange" width="1" depth="5" height="5"></a-box>

            <a-box dynamic-body position="0 6 -8" color="blue" width="9.09" depth="3" height="1"></a-box>

            <a-box dynamic-body rotation="0 90 0" position="12 2.5 -5" color="lightblue" width="1" depth="3" height="5"></a-box>

            <a-box dynamic-body rotation="0 90 0" position="12 2.5 -3" color="lightblue" width="1" depth="3" height="5"></a-box>

            <a-box dynamic-body rotation="0 90 0" position="12 2.5 1" color="purple" width="1.3" depth="1.3" height="5"></a-box>

            <a-box dynamic-body position="12 5 1" color="blue" width="3" depth="3" height="0.5"></a-box>

            <a-sphere dynamic-body radius="1" position="12 7 1" color="green"
            ></a-sphere>
 
            <a-box dynamic-body rotation="0 90 0" position="12 2.5 7" color="red" width="1" depth="3" height="5"></a-box>

        </a-scene>
    </body>
</html>
