<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
                    <a-box position="6 3 -20" height="1" width="15" depth="2" rotation="0 0 0"color="green"
                    animation="
                    property: rotation;
                    from: 0 0 0;
                    to: 0 0 45;
                    dur: 500;
                    "
            ></a-box>
            
                    <a-cone position="6 0 -20" color="blue" radius-bottom="2.5" radius-top="0.5" height="5"></a-cone>
                    
                    <a-cone position="8 5 -20" color="blue" rotation="0 0 60" radius-bottom="1" radius-top="0"
                    animation="
                    property: position;
                    from: 8 5 -20;
                    to: -18 20 -20;
                    dur: 2200;
                    "
                   animation__2="
                    property: scale;
                    from: 1 1 1;
                    to: 1.5 1.5 1.5;
                    dur: 1000; 
                    "

            ></a-cone>

                 <a-sphere color="darkred" radius="2.5"position="-6 12 -20"
                    animation="
                    property: opacity;
                    from: 1 1 1;
                    to: 0 0 0;
                    dur: 3000;
            
                    "
                    ></a-sphere>
                    
                    <a-dodecahedron rgb="(255, 0, 0)" radius="1" position="-6 12 -20" 
                    animation="
                    property:visible;
                    from:false;
                    to: true;
                    dur:3500;
                    
                    "
                  animation__2="
                    property:color;
                    from: rgb(255, 0, 0);
                    to: rgb(0, 0, 110);
                    dur:2000;
                    loop:true;
                    dir:alternate;

                    "
                    ></a-dodecahedron>
                    

        </a-scene>
    </body>
</html>
