<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
        <a-plane position="0 0 0" radius="2" rotation="-90 0 0" height="30"width="30" src="grass.jpg"
        ></a-plane></a-plane>
            
         <a-cylinder position="0 0 -10" radius="2" src="dirt.jpg"
        ></a-cylinder>   
            
         <a-cylinder position="3 0 8" radius="2" src="dirt.jpg"
        ></a-cylinder>   
            
         <a-cylinder position="-3 0 8" radius="2" src="dirt.jpg"
             ></a-cylinder>   
            
            
          <a-cylinder position="8 0 -2" radius="2" src="dirt.jpg"
              ></a-cylinder>   
            
         <a-cylinder position="-8 0 2" radius="2" src="dirt.jpg"
             ></a-cylinder>   
            
            
            
            
         
         
         
         <a-cylinder position="0 0 -10" radius="1" src="dirt2.jpg"
            animation="
         property:position;
         from: 0 0 -10;
         to: 0 1 -10;
         loop:true;
         dir:alternate;
         dur:2200;
         "
         
        animation__2="
        property:scale;
        from: 1 1 1;
        to: 0 0 0;
        startEvents:click;
         "

         ></a-cylinder>   

         <a-cylinder position="3 0 8" src="dirt2.jpg"
             animation="    
         property:position;
         from: 3 0 8;
         to: 3 1 8;
         loop:true;
         dir:alternate;
         dur:2000;
         "
        
        animation__2="
        property:scale;
        from: 1 1 1;
        to: 0 0 0;
        startEvents:click;
         "
   
         ></a-cylinder>   
            
         <a-cylinder position="-3 0 8" src="dirt2.jpg"
             animation="
         property:position;
         from: -3 0 8;
         to: -3 1 8;
         loop:true;
         dir:alternate;
         dur:3100;
         "

        animation__2="
        property:scale;
        from: 1 1 1;
        to: 0 0 0;
        startEvents:click;
         "

         ></a-cylinder>   
                
         <a-cylinder position="8 0 -2" src="dirt2.jpg"
             animation="
         property:position;
         from: 8 0 -2;
         to: 8 1 -2;
         loop:true;
         dir:alternate;
         dur:1500;
         "

        animation__2="
        property:scale;
        from: 1 1 1;
        to: 0 0 0;
        startEvents:click;
         "

         ></a-cylinder>   
         
         <a-cylinder position="-8 0 -2" src="dirt2.jpg"
             animation="
         property:position;
         from: -8 0 2;
         to: -8 1 2;
         loop:true;
         dir:alternate;
         dur:3500;
         "

        animation__2="
        property:scale;
        from: 1 1 1;
        to: 0 0 0;
        startEvents:click;
         "

         ></a-cylinder>  
         
         <a-camera>
             <a-cursor></a-cursor>
         </a-camera>
           
        </a-scene>
    </body>
</html>
